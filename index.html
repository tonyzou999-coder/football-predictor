<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>神谕足球预测</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root {
  --bg: #080c18;
  --surface: #0f1523;
  --card: #131c2e;
  --card-hover: #1a2540;
  --border: rgba(99,179,237,0.12);
  --border-glow: rgba(99,179,237,0.3);
  --cyan: #63b3ed;
  --cyan-bright: #90cdf4;
  --pink: #f687b3;
  --pink-dark: #ed64a6;
  --gold: #f6e05e;
  --gold-dim: #ecc94b;
  --green: #68d391;
  --green-dark: #48bb78;
  --text: #e2e8f0;
  --text-sub: #a0aec0;
  --muted: rgba(160,174,192,0.5);
  --red: #fc8181;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  min-height: 100vh;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99,179,237,0.07) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(246,135,179,0.05) 0%, transparent 50%);
}

/* ===== HEADER ===== */
.header {
  background: rgba(15,21,35,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-logo {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, #63b3ed, #f687b3);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.1rem;
  flex-shrink: 0;
  box-shadow: 0 0 20px rgba(99,179,237,0.3);
}
.header-title {
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: -0.3px;
  background: linear-gradient(90deg, var(--cyan-bright), var(--pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.header-sub { font-size: 0.7rem; color: var(--muted); margin-top: 1px; letter-spacing: 0.3px; }
.header-badge {
  background: rgba(99,179,237,0.1);
  border: 1px solid rgba(99,179,237,0.2);
  color: var(--cyan);
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.5px;
}

/* ===== DATE NAV ===== */
.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 14px 28px;
  background: rgba(0,0,0,0.2);
  border-bottom: 1px solid var(--border);
}
.date-btn {
  background: rgba(99,179,237,0.07);
  border: 1px solid var(--border);
  color: var(--text-sub);
  padding: 7px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 500;
  transition: all 0.18s;
  font-family: inherit;
}
.date-btn:hover {
  background: rgba(99,179,237,0.15);
  border-color: var(--border-glow);
  color: var(--cyan);
}
.date-btn.today-btn {
  background: rgba(246,224,94,0.12);
  border-color: rgba(246,224,94,0.4);
  color: var(--gold);
  font-size: 0.72rem;
  padding: 7px 12px;
  cursor: default;
}
.date-btn.today-btn:hover { background: rgba(246,224,94,0.12); }
.date-btn:disabled { opacity: 0.9; }
.date-display {
  font-size: 0.95rem;
  font-weight: 600;
  color: var(--text);
  min-width: 170px;
  text-align: center;
  letter-spacing: -0.2px;
}

/* ===== LEAGUE FILTER ===== */
.league-scroll-wrap {
  position: relative;
  border-bottom: 1px solid var(--border);
  background: rgba(0,0,0,0.15);
}
.league-filter {
  display: flex;
  flex-wrap: nowrap;
  gap: 6px;
  padding: 10px 52px 10px 20px;
  overflow-x: auto;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}
.league-filter::-webkit-scrollbar { display: none; }
.league-filter { scrollbar-width: none; }
.league-chip {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-sub);
  padding: 5px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.75rem;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.15s;
  font-family: inherit;
}
.league-chip:hover { border-color: var(--border-glow); color: var(--cyan-bright); }
.league-chip.active {
  background: rgba(99,179,237,0.12);
  border-color: rgba(99,179,237,0.35);
  color: var(--cyan-bright);
  font-weight: 600;
}
.league-scroll-arrow {
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 52px;
  background: linear-gradient(to right, transparent, rgba(8,12,24,0.97));
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--muted);
  font-size: 0.8rem;
  transition: color 0.2s;
  user-select: none;
}
.league-scroll-arrow:hover { color: var(--cyan); }

/* ===== STATS BAR ===== */
.stats-bar {
  display: flex;
  gap: 0;
  padding: 0 28px;
  background: rgba(0,0,0,0.1);
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  font-size: 0.75rem;
  white-space: nowrap;
  border-right: 1px solid var(--border);
}
.stat-item:last-child { border-right: none; }
.stat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.stat-dot.live { background: var(--red); box-shadow: 0 0 6px var(--red); animation: blink 1s infinite; }
.stat-dot.upcoming { background: var(--cyan); }
.stat-dot.finished { background: var(--text-sub); }
.stat-count { font-weight: 700; color: var(--text); }
.stat-label { color: var(--muted); }

/* ===== MATCHES AREA ===== */
.matches-area { padding: 20px 28px 40px; }
.section-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
  margin-top: 24px;
}
.section-label:first-child { margin-top: 0; }
.section-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.section-label.live-label { color: var(--red); }
.section-label.upcoming-label { color: var(--cyan); }
.section-label.finished-label { color: var(--text-sub); }
.matches-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 10px;
  margin-bottom: 8px;
}

/* ===== MATCH CARD ===== */
.match-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.18s;
  position: relative;
  overflow: hidden;
}
.match-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: transparent;
  transition: background 0.18s;
}
.match-card:hover {
  background: var(--card-hover);
  border-color: var(--border-glow);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3), 0 0 0 1px rgba(99,179,237,0.1);
}
.match-card:hover::before { background: linear-gradient(90deg, var(--cyan), var(--pink)); }
.match-card.card-live { border-color: rgba(252,129,129,0.25); }
.match-card.card-live::before { background: linear-gradient(90deg, var(--red), var(--pink)); }
.match-card.card-finished {
  opacity: 0.6;
  cursor: default;
}
.match-card.card-finished:hover {
  transform: none;
  box-shadow: none;
  border-color: var(--border);
  background: var(--card);
}
.match-card.card-finished:hover::before { background: transparent; }

.match-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.match-league-tag {
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--text-sub);
  background: rgba(255,255,255,0.05);
  padding: 2px 8px;
  border-radius: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 70%;
}
.match-status-badge {
  font-size: 0.63rem;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 4px;
  letter-spacing: 0.3px;
  flex-shrink: 0;
}
.badge-live {
  background: rgba(252,129,129,0.15);
  color: var(--red);
  border: 1px solid rgba(252,129,129,0.3);
}
.badge-finished {
  background: rgba(104,211,145,0.1);
  color: var(--green);
  border: 1px solid rgba(104,211,145,0.2);
}
.badge-upcoming {
  background: rgba(99,179,237,0.08);
  color: var(--text-sub);
  border: 1px solid rgba(99,179,237,0.15);
}
.match-status-dot {
  display: inline-block;
  width: 5px; height: 5px;
  background: var(--red);
  border-radius: 50%;
  margin-right: 3px;
  vertical-align: middle;
  animation: blink 1s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

.match-teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.team-side {
  flex: 1;
  min-width: 0;
}
.team-side.home { text-align: left; }
.team-side.away { text-align: right; }
.team-name {
  font-size: 0.88rem;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text);
  letter-spacing: -0.2px;
}
.match-score-area {
  text-align: center;
  flex-shrink: 0;
  min-width: 60px;
}
.score-display {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: 1px;
  line-height: 1;
}
.score-display.vs-text {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 2px;
}
.score-home-win { color: var(--cyan-bright); }
.score-away-win { color: var(--pink); }
.score-draw { color: var(--text-sub); }
.score-live { color: var(--red); }

.match-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.match-time-text {
  font-size: 0.72rem;
  color: var(--muted);
}
.predict-hint {
  font-size: 0.68rem;
  color: rgba(99,179,237,0.45);
  font-weight: 500;
}

/* ===== LOADING / EMPTY ===== */
.loading-wrap, .empty-wrap {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
}
.spinner {
  width: 36px; height: 36px;
  border: 2px solid rgba(99,179,237,0.1);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.empty-icon { font-size: 2.5rem; margin-bottom: 14px; opacity: 0.5; }
.empty-text { font-size: 0.9rem; }
.error-box {
  background: rgba(252,129,129,0.07);
  border: 1px solid rgba(252,129,129,0.25);
  border-radius: 10px;
  padding: 24px;
  color: var(--red);
  margin: 40px auto;
  max-width: 460px;
  text-align: center;
  line-height: 1.7;
}

/* ===== MODAL ===== */
.modal-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(6px);
  z-index: 100;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  max-height: 92vh;
  overflow-y: auto;
  padding: 24px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(99,179,237,0.08);
  position: relative;
}
/* 弹窗顶部青色光晕 */
.modal::before {
  content: '';
  position: absolute;
  top: 0; left: 50%; transform: translateX(-50%);
  width: 80%; height: 160px;
  background: radial-gradient(ellipse at top, rgba(99,179,237,0.10) 0%, transparent 70%);
  pointer-events: none;
  border-radius: 16px 16px 0 0;
  z-index: 0;
}
.modal::-webkit-scrollbar { width: 4px; }
.modal::-webkit-scrollbar-track { background: transparent; }
.modal::-webkit-scrollbar-thumb { background: rgba(99,179,237,0.2); border-radius: 2px; }
.modal-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 4px; }
.modal-close {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border);
  color: var(--muted);
  width: 28px; height: 28px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}
.modal-close:hover { color: var(--text); background: rgba(255,255,255,0.1); }
.modal-title { font-size: 1rem; font-weight: 700; color: var(--text); letter-spacing: -0.3px; }
/* 鑱旇禌鍚嶅僵鑹叉爣绛?*/
.modal-league {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 600;
  color: var(--cyan-bright);
  background: rgba(99,179,237,0.1);
  border: 1px solid rgba(99,179,237,0.25);
  padding: 2px 10px;
  border-radius: 20px;
  margin-bottom: 16px;
  margin-top: 2px;
  letter-spacing: 0.3px;
}
.modal-matchup {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: linear-gradient(135deg, rgba(99,179,237,0.07) 0%, rgba(0,0,0,0.25) 50%, rgba(246,135,179,0.07) 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 16px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
}
.modal-matchup::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 60% 100% at 50% 50%, rgba(99,179,237,0.04), transparent);
  pointer-events: none;
}
.modal-team { text-align: center; flex: 1; }
.modal-team-name { font-size: 0.95rem; font-weight: 700; color: var(--text); }
.modal-team-role {
  font-size: 0.63rem;
  color: var(--muted);
  margin-top: 5px;
  background: rgba(255,255,255,0.05);
  display: inline-block;
  padding: 1px 8px;
  border-radius: 4px;
}
.modal-vs { color: var(--muted); font-size: 1.1rem; font-weight: 800; flex-shrink: 0; letter-spacing: 2px; opacity: 0.55; }
.modal-time { text-align: center; color: var(--muted); font-size: 0.75rem; margin-bottom: 18px; letter-spacing: 0.2px; }
.models-title {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  font-weight: 600;
  margin-bottom: 10px;
}
.model-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.model-btn {
  flex: 1;
  min-width: 100px;
  padding: 12px 8px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  color: var(--text-sub);
  cursor: pointer;
  font-size: 0.8rem;
  font-weight: 500;
  text-align: center;
  transition: all 0.2s cubic-bezier(0.34,1.56,0.64,1);
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.model-btn:hover { border-color: var(--border-glow); color: var(--cyan-bright); transform: translateY(-1px); }
.model-btn.active {
  border-color: rgba(99,179,237,0.5);
  background: rgba(99,179,237,0.12);
  color: var(--cyan-bright);
  font-weight: 600;
  transform: scale(1.03);
  box-shadow: 0 0 12px rgba(99,179,237,0.2), 0 0 0 1px rgba(99,179,237,0.15);
}
.model-btn-icon { font-size: 1.15rem; line-height: 1; flex-shrink:0; }
.model-btn-label { font-size: 0.78rem; font-weight: 600; }
.model-btn-sub { font-size: 0.62rem; color: var(--muted); }
.model-tier-badge { margin-left:auto; font-size:0.58rem; font-weight:700; padding:2px 7px; border-radius:10px; flex-shrink:0; letter-spacing:0.5px; }
.tier-basic { background:rgba(104,211,145,0.12); color:var(--green); border:1px solid rgba(104,211,145,0.25); }
.tier-mid { background:rgba(246,224,94,0.12); color:var(--gold); border:1px solid rgba(246,224,94,0.25); }
.tier-god { background:rgba(246,135,179,0.15); color:var(--pink); border:1px solid rgba(246,135,179,0.3); }
.result-score-pred { text-align:center; font-size:1.6rem; font-weight:800; letter-spacing:6px; margin:8px 0 14px; color:var(--cyan-bright); }
.result-factors { margin-top:10px; display:flex; flex-wrap:wrap; gap:5px; }
.factor-chip { font-size:0.63rem; padding:3px 8px; border-radius:10px; border:1px solid var(--border); color:var(--text-sub); background:rgba(255,255,255,0.03); }
@keyframes summon-glow {
  0%, 100% { box-shadow: 0 0 12px rgba(99,179,237,0.3), 0 0 24px rgba(246,100,163,0.15); }
  50% { box-shadow: 0 0 22px rgba(99,179,237,0.5), 0 0 40px rgba(246,100,163,0.3); }
}
.summon-btn {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, var(--cyan), var(--pink-dark));
  color: #fff;
  font-size: 0.95rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 14px;
  transition: opacity 0.2s, transform 0.15s;
  font-family: inherit;
  letter-spacing: 0.5px;
  animation: summon-glow 2.4s ease-in-out infinite;
}
.summon-btn:hover { opacity: 0.92; transform: translateY(-2px); animation: none; box-shadow: 0 8px 24px rgba(99,179,237,0.4); }
.summon-btn:active { transform: translateY(0); }
.summon-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; animation: none; box-shadow: none; }

/* ===== PREDICTION RESULT ===== */
.prediction-result {
  margin-top: 18px;
  background: rgba(0,0,0,0.2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  display: none;
}
.prediction-result.show { display: block; }
.result-model-name { font-size: 0.7rem; color: var(--muted); margin-bottom: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }
.result-winner { font-size: 1rem; font-weight: 700; color: var(--gold); margin-bottom: 12px; }
.result-probs { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
.prob-bar-wrap {}
.prob-label { font-size: 0.7rem; color: var(--text-sub); margin-bottom: 4px; display: flex; justify-content: space-between; font-weight: 500; }
.prob-bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,0.06); overflow: hidden; }
.prob-fill { height: 100%; border-radius: 3px; transition: width 0.7s cubic-bezier(0.4,0,0.2,1); }
.result-analysis { font-size: 0.8rem; color: var(--text-sub); line-height: 1.7; }
.result-key-factor { margin-top: 8px; font-size: 0.75rem; color: var(--cyan); font-weight: 500; }
.all-results { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 14px; display: none; }
.all-results.show { display: block; }
.all-results-title { font-size: 0.65rem; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
.result-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.78rem; }
.result-row:last-child { border-bottom: none; }
.result-row-model { color: var(--text-sub); }
.result-row-pick { color: var(--gold); font-weight: 600; }
.consensus { margin-top: 10px; padding: 10px 12px; background: rgba(99,179,237,0.05); border: 1px solid rgba(99,179,237,0.12); border-radius: 8px; font-size: 0.78rem; color: var(--cyan); text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="header-logo">🔮</div>
    <div>
      <div class="header-title">神谕足球预测</div>
      <div class="header-sub">ESPN 实时赛程 · AI 多模型预测</div>
    </div>
  </div>
  <div class="header-badge" id="matchCountBadge">加载中...</div>

function cnName(name) {
  if (!name) return name;
  if (TEAM_CN[name]) return TEAM_CN[name];
  // 模糊匹配（处理带括号等变体）
  for (var k in TEAM_CN) {
    if (name === k) return TEAM_CN[k];
    if (name.indexOf(k) >= 0 && k.length > 4) return TEAM_CN[k];
  }
  return name;
}

function getChinaToday() {
  var now = new Date();
  // 返回一个 Date 对象，其 UTC 时间 = 中国时间的今天 00:00
  var chinaMs = now.getTime() + 8 * 3600000;
  var d = new Date(chinaMs);
  return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
}
var currentDate = getChinaToday();
var allMatches = [];
var currentLeague = 'ALL';
var selectedModel = 'luopan';
var currentMatch = null;

function fmt(d) {
  // d 已经是"中国日期的 UTC 零点"，直接取 ISO 日期即可
  return d.toISOString().slice(0, 10);
}
function fmtDisplay(d) {
  var y = d.getUTCFullYear();
  var mo = d.getUTCMonth();
  var day = d.getUTCDate();
  var wd = ['周日','周一','周二','周三','周四','周五','周六'][new Date(y, mo, day).getDay()];
  return y + '年' + (mo + 1) + '月' + day + '日 ' + wd;
}
function goToday() { currentDate = getChinaToday(); loadMatches(); }
function changeDate(delta) {
  currentDate = new Date(currentDate.getTime() + delta * 86400000);
  loadMatches();
}
function updateTodayBtn() {
  var btn = document.getElementById('todayBtn');
  if (!btn) return;
  var today = getChinaToday();
  var isToday = currentDate.getTime() === today.getTime();
  if (isToday) {
    btn.textContent = '今天';
    btn.classList.add('today-btn');
    btn.disabled = true;
  } else {
    btn.textContent = '回今天';
    btn.classList.remove('today-btn');
    btn.disabled = false;
  }
}

var autoRefreshTimer = null;

function parseEvents(events) {
  return events.map(function(ev) {
    var comp = ev.competitions && ev.competitions[0];
    var comps = (comp && comp.competitors) || [];
    var home = comps.find(function(c){return c.homeAway==='home';}) || comps[0] || {};
    var away = comps.find(function(c){return c.homeAway==='away';}) || comps[1] || {};
    var status = (comp && comp.status && comp.status.type && comp.status.type.name) || '';
    var uidMatch = ev.uid && ev.uid.match(/l:(\d+)/);
    var leagueIdKey = uidMatch ? 'l:' + uidMatch[1] : '';
    var seasonSlug = (ev.season && ev.season.slug) || '';
    var leagueCN = (leagueIdKey && LEAGUE_CN[leagueIdKey]) ||
                   (seasonSlug && LEAGUE_CN[seasonSlug]) ||
                   '国际赛';
    var homeScore = (home.score !== undefined && home.score !== null) ? parseInt(home.score) : null;
    var awayScore = (away.score !== undefined && away.score !== null) ? parseInt(away.score) : null;
    return {
      id: ev.id,
      utcDate: ev.date,
      homeTeam: { name: (home.team&&home.team.displayName)||'主队', shortName: (home.team&&home.team.shortDisplayName)||'' },
      awayTeam: { name: (away.team&&away.team.displayName)||'客队', shortName: (away.team&&away.team.shortDisplayName)||'' },
      status: status,
      homeScore: homeScore,
      awayScore: awayScore,
      leagueName: leagueCN,
      leagueCode: leagueIdKey || seasonSlug || 'INT'
    };
  });
}

function scheduleAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  var hasLive = allMatches.some(function(m){ return getMatchState(m) === 'live'; });
  if (hasLive) {
    autoRefreshTimer = setInterval(function(){
      loadMatches(true); // 静默刷新
    }, 60000);
  }
}

async function loadMatches(silent) {
  document.getElementById('dateDisplay').textContent = fmtDisplay(currentDate);
  updateTodayBtn();
  if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
  var area = document.getElementById('matchesArea');
  if (!silent) {
    area.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><div>正在抓取赛程...</div></div>';
  }
  var dateStr = fmt(currentDate).replace(/-/g,'');
  var cacheKey = 'espn_' + dateStr;
  var today = getChinaToday();
  var isToday = currentDate.getTime() === today.getTime();

  // 非今天的过去日期 → 读缓存（缓存5分钟内有效）
  if (!isToday) {
    try {
      var cached = sessionStorage.getItem(cacheKey);
      if (cached) {
        var obj = JSON.parse(cached);
        if (Date.now() - obj.ts < 5 * 60000) {
          allMatches = obj.data;
          buildLeagueFilter();
          renderMatches();
          scheduleAutoRefresh();
          return;
        }
      }
    } catch(e) {}
  }

  var url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates='+dateStr+'&limit=200';
  try {
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP '+res.status);
    var data = await res.json();
    allMatches = parseEvents(data.events || []);
    // 过去日期写入缓存
    if (!isToday) {
      try { sessionStorage.setItem(cacheKey, JSON.stringify({ts: Date.now(), data: allMatches})); } catch(e) {}
    }
    buildLeagueFilter();
    renderMatches();
    scheduleAutoRefresh();
  } catch(e) {
    if (!silent) {
      area.innerHTML = '<div class="error-box">加载失败：'+e.message+'<br><small>ESPN API 请求出错，请稍后重试</small></div>';
    }
  }
}

function buildLeagueFilter() {
  var leagueCount = {};
  allMatches.forEach(function(m){
    var name = m.leagueName || '国际赛';
    leagueCount[name] = (leagueCount[name] || 0) + 1;
  });
  var sorted = Object.keys(leagueCount).sort(function(a,b){ return leagueCount[b]-leagueCount[a]; });
  var wrap = document.getElementById('leagueFilter');
  wrap.innerHTML = '';
  // 全部按钮
  var all = document.createElement('div');
  all.className = 'league-chip active';
  all.dataset.league = 'ALL';
  all.textContent = '全部 ('+allMatches.length+')';
  all.onclick = function(){ filterLeague(this); };
  wrap.appendChild(all);
  sorted.forEach(function(name){
    var cnt = leagueCount[name];

function getMatchState(m) {
  var st=(m.status||'').toLowerCase();
  var isLive = st==='status_first_half'||st==='status_second_half'||st==='status_halftime'||st==='status_in_progress'||st.indexOf('first_half')>=0||st.indexOf('second_half')>=0||st.indexOf('in_progress')>=0;
  var isFinished = st==='status_full_time'||st==='status_final'||st==='status_finished'||st.indexOf('full_time')>=0||st.indexOf('final')>=0||st.indexOf('finished')>=0;
  if (!isLive && !isFinished && m.utcDate) {
    // 用北京时间判断：若开球时间已过 90 分钟，视为已结束
    var kickoff = new Date(m.utcDate);
    var nowBJ = new Date().getTime() + 8 * 3600000; // 当前北京时间戳
    var kickoffBJ = kickoff.getTime() + 8 * 3600000;
    if (!isNaN(kickoffBJ) && nowBJ - kickoffBJ > 90 * 60000) {
      isFinished = true;
    }
  }
  return isLive ? 'live' : isFinished ? 'finished' : 'upcoming';
}

function updateStatsBadge(matches) {
  var live=0,upcoming=0,finished=0;
  matches.forEach(function(m){
    var s=getMatchState(m);
    if(s==='live') live++;
    else if(s==='finished') finished++;
    else upcoming++;
  });
  var badge = document.getElementById('matchCountBadge');
  if(badge) badge.textContent = matches.length + ' 场赛事';
  var bar = document.getElementById('statsBar');
  if(!bar) return;
  bar.innerHTML =
    (live>0?'<div class="stat-item"><span class="stat-dot live"></span><span class="stat-count">'+live+'</span><span class="stat-label">直播中</span></div>':'')+
    '<div class="stat-item"><span class="stat-dot upcoming"></span><span class="stat-count">'+upcoming+'</span><span class="stat-label">待开赛</span></div>'+
    '<div class="stat-item"><span class="stat-dot finished"></span><span class="stat-count">'+finished+'</span><span class="stat-label">已结束</span></div>';
}

function renderMatches() {
  var area = document.getElementById('matchesArea');
  var matches = currentLeague==='ALL' ? allMatches : allMatches.filter(function(m){return (m.leagueName||'国际赛')===currentLeague;});
  updateStatsBadge(matches);
  if (!matches.length) {
    area.innerHTML='<div class="empty-wrap"><div class="empty-icon">📭</div><div class="empty-text">该日期暂无比赛数据</div></div>';
    return;
  }
  matches.sort(function(a,b){return new Date(a.utcDate)-new Date(b.utcDate);});
  var live=[], upcoming=[], finished=[];
  matches.forEach(function(m){
    var s=getMatchState(m);
    if(s==='live') live.push(m);
    else if(s==='finished') finished.push(m);
    else upcoming.push(m);
  });
  area.innerHTML='';
  function renderGroup(label, list, labelClass) {
    if(!list.length) return;
    var lbl=document.createElement('div');
    lbl.className='section-label '+(labelClass||'');
    lbl.textContent=label;
    area.appendChild(lbl);
    var grid=document.createElement('div');
    grid.className='matches-grid';
    list.forEach(function(m){grid.appendChild(buildMatchCard(m));});
    area.appendChild(grid);
  }
  renderGroup('🔴  直播中', live, 'live-label');
  renderGroup('⏳  待开赛', upcoming, 'upcoming-label');
  renderGroup('✓  已结束', finished, 'finished-label');
}

function buildMatchCard(m) {
  var state = getMatchState(m);
  var card=document.createElement('div');
  card.className='match-card' + (state==='live'?' card-live':state==='finished'?' card-finished':'');
  var hasScore = m.homeScore !== null && m.awayScore !== null;
  var hn=cnName((m.homeTeam&&m.homeTeam.name)||'主队');
  var an=cnName((m.awayTeam&&m.awayTeam.name)||'客队');
  var leagueTxt = cnName(m.leagueName||'国际赛');

  var badgeHtml, scoreHtml, footerRight;
  if (state==='live') {
    badgeHtml='<span class="match-status-badge badge-live"><span class="match-status-dot"></span>直播中</span>';
    var sc = hasScore ? m.homeScore+'  '+m.awayScore : 'VS';
    scoreHtml='<div class="match-score-area"><div class="score-display score-live">'+sc+'</div></div>';
    footerRight='';
  } else if (state==='finished') {
    badgeHtml='<span class="match-status-badge badge-finished">已结束</span>';
    if (hasScore) {
      var cls = m.homeScore>m.awayScore?'score-home-win':m.awayScore>m.homeScore?'score-away-win':'score-draw';
      scoreHtml='<div class="match-score-area"><div class="score-display '+cls+'">'+m.homeScore+'  -  '+m.awayScore+'</div></div>';
    } else {
      scoreHtml='<div class="match-score-area"><div class="score-display score-draw" style="font-size:0.8rem;color:var(--muted)">比分未知</div></div>';
    }
    footerRight='<span class="predict-hint" style="color:var(--muted)">查看复盘 ›</span>';
  } else {
    var kickoff=new Date(m.utcDate);
    var local='--:--';
    if(!isNaN(kickoff.getTime())){
      // 转换为北京时间（UTC+8）显示
      var bj=new Date(kickoff.getTime()+8*3600000);
      local=String(bj.getUTCHours()).padStart(2,'0')+':'+String(bj.getUTCMinutes()).padStart(2,'0');
    }
    badgeHtml='<span class="match-status-badge badge-upcoming">'+local+'</span>';
    scoreHtml='<div class="match-score-area"><div class="score-display vs-text">VS</div></div>';
    footerRight='<span class="predict-hint">点击预测 ›</span>';
  }

  card.innerHTML=
    '<div class="match-header">'+
      '<span class="match-league-tag">'+leagueTxt+'</span>'+
      badgeHtml+
    '</div>'+
    '<div class="match-teams">'+
      '<div class="team-side home"><div class="team-name">'+hn+'</div></div>'+
      scoreHtml+
      '<div class="team-side away"><div class="team-name">'+an+'</div></div>'+
    '</div>'+
    '<div class="match-footer"><span></span>'+footerRight+'</div>';

  card.style.cursor='pointer';
  if (state==='finished') {
    card.onclick=function(){openReview(m);};
  } else {
    card.onclick=function(){openPrediction(m);};
  }
  return card;
}

function buildProbBars(home, away, h, d, a) {
  function bar(label, pct, color) {
    return '<div class="prob-bar-wrap"><div class="prob-label"><span>' + label + '</span><span>' + (pct * 100).toFixed(1) + '%</span></div><div class="prob-bar"><div class="prob-fill" style="width:' + (pct * 100).toFixed(1) + '%;background:' + color + '"></div></div></div>';
  }

// 泊松分布：P(X=k) = e^(-λ) * λ^k / k!
function poissonProb(lambda, k) {
  var p = Math.exp(-lambda);
  for (var i = 1; i <= k; i++) p *= lambda / i;
  return p;
}

// 用泊松分布矩阵计算主/平/客概率 + 最可能比分
function poissonMatrix(hLambda, aLambda, maxGoal) {
  maxGoal = maxGoal || 8;
  var hWin = 0, draw = 0, aWin = 0;
  var bestProb = 0, bestScore = [0, 0];
  for (var i = 0; i <= maxGoal; i++) {
    for (var j = 0; j <= maxGoal; j++) {
      var p = poissonProb(hLambda, i) * poissonProb(aLambda, j);
      if (i > j) hWin += p;
      else if (i === j) draw += p;
      else aWin += p;
      if (p > bestProb) { bestProb = p; bestScore = [i, j]; }
    }
  }
  return { hWin: hWin, draw: draw, aWin: aWin, bestScore: bestScore };
}

// 基于种子的伪随机数生成器（mulberry32算法），保证同场比赛结果稳定
function seededRng(seed) {
  var s = seed >>> 0;
  return function() {
    s += 0x6D2B79F5;
    var t = Math.imul(s ^ (s >>> 15), 1 | s);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// 从比赛ID生成数字种子
function matchSeed(matchId) {
  var s = 0;
  var str = String(matchId || '0');
  for (var i = 0; i < str.length; i++) {
    s = (Math.imul(31, s) + str.charCodeAt(i)) | 0;
  }
  return Math.abs(s);
}

// 蒙特卡洛模拟（用于天机神算），seed固定则结果稳定
function monteCarlo(hLambda, aLambda, n, seed) {
  n = n || 10000;
  var rng = seededRng(seed !== undefined ? seed : 42);
  var hWin = 0, draw = 0, aWin = 0;
  var scoreMap = {};
  for (var i = 0; i < n; i++) {
    var hG = poissonRandom(hLambda, rng), aG = poissonRandom(aLambda, rng);
    var key = hG + '-' + aG;
    scoreMap[key] = (scoreMap[key] || 0) + 1;
    if (hG > aG) hWin++;
    else if (hG === aG) draw++;
    else aWin++;
  }
  // 找最高频比分
  var bestKey = Object.keys(scoreMap).reduce(function(a, b) { return scoreMap[a] > scoreMap[b] ? a : b; });
  var parts = bestKey.split('-');
  return {
    hWin: hWin / n, draw: draw / n, aWin: aWin / n,
    bestScore: [parseInt(parts[0]), parseInt(parts[1])],
    scoreMap: scoreMap, n: n
  };
}

function poissonRandom(lambda, rng) {
  var rand = rng || Math.random;
  var L = Math.exp(-lambda), k = 0, p = 1;
  do { k++; p *= (typeof rand === 'function' ? rand() : Math.random()); } while (p > L);
  return k - 1;
}

// 获取比赛 summary（近期战绩、对阵历史、球员信息等）
async function fetchMatchSummary(matchId) {
  var cacheKey = 'sum_' + matchId;
  try {
    var cached = sessionStorage.getItem(cacheKey);
    if (cached) return JSON.parse(cached);
  } catch(e) {}
  try {
    var url = 'https://site.api.espn.com/apis/site/v2/sports/soccer/all/summary?event=' + matchId;
    var res = await fetch(url);
    if (!res.ok) return null;
    var data = await res.json();
    try { sessionStorage.setItem(cacheKey, JSON.stringify(data)); } catch(e) {}
    return data;
  } catch(e) { return null; }
}

// 从 summary 提取球队数据
function extractTeamStats(summary, homeId) {
  // boxscore competitors
  var competitors = (summary.boxscore && summary.boxscore.teams) || [];
  var homeStats = null, awayStats = null;
  competitors.forEach(function(t) {
    var isHome = t.homeAway === 'home';
    var stats = {};
    (t.statistics || []).forEach(function(s) { stats[s.name] = s.displayValue; });
    if (isHome) homeStats = stats; else awayStats = stats;
  });
  return { homeStats: homeStats || {}, awayStats: awayStats || {} };
}

// 从 summary header 提取近期战绩（lastFiveGames）
function extractRecentForm(summary) {
  var result = { home: [], away: [] };
  try {
    var comps = summary.header && summary.header.competitions && summary.header.competitions[0];
    if (!comps) return result;
    comps.competitors.forEach(function(c) {
      var form = [];
      (c.form || '').split('').forEach(function(ch) { form.push(ch.toUpperCase()); });
      if (c.homeAway === 'home') result.home = form;
      else result.away = form;
    });
  } catch(e) {}
  return result;
}

// 从 season series（H2H）提取历史对阵
function extractH2H(summary) {
  var result = { homeWins: 0, draws: 0, awayWins: 0, total: 0 };
  try {
    var series = summary.seasonseries || summary.seasonSeries || [];
    series.forEach(function(s) {
      (s.events || []).forEach(function(ev) {
        var comps = (ev.competitions && ev.competitions[0] && ev.competitions[0].competitors) || [];
        var home = comps.find(function(c) { return c.homeAway === 'home'; });
        var away = comps.find(function(c) { return c.homeAway === 'away'; });
        if (home && away && home.score !== undefined && away.score !== undefined) {
          result.total++;
          var hs = parseInt(home.score), as = parseInt(away.score);
          if (hs > as) result.homeWins++;
          else if (hs === as) result.draws++;
          else result.awayWins++;
        }
      });
    });
  } catch(e) {}
  return result;
}

// 从 summary 提取伤停信息（缺少主力球员数量）
function extractInjuries(summary) {
  var result = { homeOut: 0, awayOut: 0, homeKey: [], awayKey: [] };
  try {
    var injuries = summary.injuries || [];
    injuries.forEach(function(team) {
      var side = (team.team && team.team.homeAway) || '';
      var count = (team.injuries || []).filter(function(p) {
        var s = (p.status || '').toLowerCase();
        return s === 'out' || s === 'doubtful';
      }).length;
      if (side === 'home') result.homeOut = count;
      else result.awayOut = count;
    });
  } catch(e) {}
  return result;
}

// 从 standings API 获取积分榜数据（真实积分/进球/失球）
async function fetchStandings(leagueCode) {
  if (!leagueCode || leagueCode === 'INT') return null;
  // 从leagueCode提取espn slug
  var slug = LEAGUE_ESPN_SLUG[leagueCode];
  if (!slug) return null;
  var cacheKey = 'std_' + slug;
  try {
    var cached = sessionStorage.getItem(cacheKey);
    if (cached) { var obj = JSON.parse(cached); if (Date.now() - obj.ts < 30 * 60000) return obj.data; }
  } catch(e) {}
  try {
    var url = 'https://site.api.espn.com/apis/v2/sports/soccer/' + slug + '/standings';
    var res = await fetch(url);
    if (!res.ok) return null;
    var data = await res.json();
    try { sessionStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), data: data })); } catch(e) {}
    return data;
  } catch(e) { return null; }
}

// 从积分榜数据中查找球队统计
function findTeamInStandings(standingsData, teamName) {
  if (!standingsData) return null;
  var entries = [];
  try {
    var groups = (standingsData.standings && standingsData.standings.entries) ||
                 (standingsData.children && standingsData.children[0] && standingsData.children[0].standings && standingsData.children[0].standings.entries) || [];
    entries = groups;
  } catch(e) {}
  var found = null;
  entries.forEach(function(e) {
    var name = (e.team && e.team.displayName) || '';
    if (name === teamName || cnName(name) === cnName(teamName)) {
      found = e;
    }
  });
  if (!found) return null;
  var stats = {};
  (found.stats || []).forEach(function(s) { stats[s.name || s.abbreviation] = s.value !== undefined ? s.value : parseFloat(s.displayValue) || 0; });
  return stats;
}

async function fetchWeather(lat, lon, dateStr) {
  // dateStr: YYYY-MM-DD
  try {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
              '&daily=precipitation_sum,windspeed_10m_max,temperature_2m_max,temperature_2m_min' +
              '&start_date=' + dateStr + '&end_date=' + dateStr + '&timezone=auto';
    var res = await fetch(url);
    if (!res.ok) return null;
    var data = await res.json();
    var daily = data.daily;
    if (!daily) return null;
    return {
      rain: (daily.precipitation_sum && daily.precipitation_sum[0]) || 0,
      wind: (daily.windspeed_10m_max && daily.windspeed_10m_max[0]) || 0,
      tempMax: (daily.temperature_2m_max && daily.temperature_2m_max[0]) || 20,
      tempMin: (daily.temperature_2m_min && daily.temperature_2m_min[0]) || 10
    };
  } catch(e) { return null; }
}

// ESPN slug 映射（用于积分榜查询）
var LEAGUE_ESPN_SLUG = {

// 形态分值：W=3, D=1, L=0，加权最近
function formScore(formArr) {
  var weights = [0.30, 0.25, 0.20, 0.15, 0.10];
  var score = 0, total = 0;
  formArr.slice(0, 5).forEach(function(r, i) {
    var w = weights[i] || 0.10;
    if (r === 'W') score += 3 * w;
    else if (r === 'D') score += 1 * w;
    total += 3 * w;
  });
  return total > 0 ? score / total : 0.5;
}

// =====================================================
// 模型一：星象罗盘（基础 · 积分榜 + 泊松）
// =====================================================
async function modelLuoPan(m, summary, standings) {
  var home = cnName((m.homeTeam && m.homeTeam.name) || '主队');
  var away = cnName((m.awayTeam && m.awayTeam.name) || '客队');
  var factors = [];

  // 从积分榜获取真实数据
  var homeStd = standings ? findTeamInStandings(standings, m.homeTeam && m.homeTeam.name) : null;
  var awayStd = standings ? findTeamInStandings(standings, m.awayTeam && m.awayTeam.name) : null;

  var hGoalFor = 1.5, hGoalAgainst = 1.2, aGoalFor = 1.2, aGoalAgainst = 1.5;
  var hPlayed = 1, aPlayed = 1;

  if (homeStd) {
    hPlayed = homeStd['gamesPlayed'] || homeStd['GP'] || 1;
    hGoalFor = (homeStd['pointsFor'] || homeStd['GF'] || homeStd['goalsFor'] || hGoalFor * hPlayed) / hPlayed;
    hGoalAgainst = (homeStd['pointsAgainst'] || homeStd['GA'] || homeStd['goalsAgainst'] || hGoalAgainst * hPlayed) / hPlayed;
    factors.push(home + ' 积分榜场均进球 ' + hGoalFor.toFixed(2));
  }
  if (awayStd) {
    aPlayed = awayStd['gamesPlayed'] || awayStd['GP'] || 1;
    aGoalFor = (awayStd['pointsFor'] || awayStd['GF'] || awayStd['goalsFor'] || aGoalFor * aPlayed) / aPlayed;
    aGoalAgainst = (awayStd['pointsAgainst'] || awayStd['GA'] || awayStd['goalsAgainst'] || aGoalAgainst * aPlayed) / aPlayed;
    factors.push(away + ' 积分榜场均进球 ' + aGoalFor.toFixed(2));
  }

  // 泊松期望进球数：基于双方进攻/防守均值
  var leagueAvg = 1.35;
  var hLambda = Math.max(0.3, (hGoalFor * aGoalAgainst) / leagueAvg);
  var aLambda = Math.max(0.3, (aGoalFor * hGoalAgainst) / leagueAvg);

  // 主场优势加成（历史上主场平均多0.3个球）
  hLambda *= 1.12;
  factors.push('主场优势加成 +12%');

  var matrix = poissonMatrix(hLambda, aLambda, 8);
  var total = matrix.hWin + matrix.draw + matrix.aWin;
  var hProb = matrix.hWin / total, dProb = matrix.draw / total, aProb = matrix.aWin / total;

  return {
    hProb: hProb, dProb: dProb, aProb: aProb,
    hLambda: hLambda, aLambda: aLambda,
    bestScore: matrix.bestScore,
    home: home, away: away,
    analysis: '基于积分榜真实进球数据，泊松分布精算。' + home + ' 期望进球 ' + hLambda.toFixed(2) + '，' + away + ' 期望进球 ' + aLambda.toFixed(2),
    keyFactor: '泊松期望比分 ' + matrix.bestScore[0] + ':' + matrix.bestScore[1],
    factors: factors
  };
}

// =====================================================
// 模型二：战神推演（中级 · 近战 + H2H + 伤停）
// =====================================================
async function modelZhanShen(m, summary, standings) {
  var home = cnName((m.homeTeam && m.homeTeam.name) || '主队');
  var away = cnName((m.awayTeam && m.awayTeam.name) || '客队');
  var factors = [];

  // 基础：积分榜 lambda
  var homeStd = standings ? findTeamInStandings(standings, m.homeTeam && m.homeTeam.name) : null;
  var awayStd = standings ? findTeamInStandings(standings, m.awayTeam && m.awayTeam.name) : null;
  var hGoalFor = 1.5, hGoalAgainst = 1.2, aGoalFor = 1.2, aGoalAgainst = 1.5;
  if (homeStd) {
    var hP = homeStd['gamesPlayed'] || homeStd['GP'] || 1;
    hGoalFor = (homeStd['pointsFor'] || homeStd['GF'] || homeStd['goalsFor'] || hGoalFor * hP) / hP;
    hGoalAgainst = (homeStd['pointsAgainst'] || homeStd['GA'] || homeStd['goalsAgainst'] || hGoalAgainst * hP) / hP;
  }
  if (awayStd) {
    var aP = awayStd['gamesPlayed'] || awayStd['GP'] || 1;
    aGoalFor = (awayStd['pointsFor'] || awayStd['GF'] || awayStd['goalsFor'] || aGoalFor * aP) / aP;
    aGoalAgainst = (awayStd['pointsAgainst'] || awayStd['GA'] || awayStd['goalsAgainst'] || aGoalAgainst * aP) / aP;
  }
  var leagueAvg = 1.35;
  var hLambda = Math.max(0.3, (hGoalFor * aGoalAgainst) / leagueAvg) * 1.12;
  var aLambda = Math.max(0.3, (aGoalFor * hGoalAgainst) / leagueAvg);

  // 近期战绩修正
  var form = extractRecentForm(summary);
  var hForm = form.home.length > 0 ? formScore(form.home) : 0.5;
  var aForm = form.away.length > 0 ? formScore(form.away) : 0.5;
  var hFormMod = 0.75 + hForm * 0.5; // 0.75~1.25
  var aFormMod = 0.75 + aForm * 0.5;
  hLambda *= hFormMod;
  aLambda *= aFormMod;
  if (form.home.length > 0) {
    factors.push(home + ' 近' + form.home.length + '场：' + form.home.join('') + ' (状态系数' + hFormMod.toFixed(2) + ')');
  }
  if (form.away.length > 0) {
    factors.push(away + ' 近' + form.away.length + '场：' + form.away.join('') + ' (状态系数' + aFormMod.toFixed(2) + ')');
  }

  // H2H历史对阵
  var h2h = extractH2H(summary);
  if (h2h.total > 0) {
    var hH2H = h2h.homeWins / h2h.total;
    var aH2H = h2h.awayWins / h2h.total;
    hLambda *= (0.85 + hH2H * 0.3);
    aLambda *= (0.85 + aH2H * 0.3);
    factors.push('H2H历史' + h2h.total + '场：主' + h2h.homeWins + '胜 / 平' + h2h.draws + ' / 客' + h2h.awayWins + '胜');
  }

  // 伤停修正
  var injuries = extractInjuries(summary);
  if (injuries.homeOut > 0) {
    var hInj = Math.max(0.7, 1 - injuries.homeOut * 0.04);
    hLambda *= hInj;
    factors.push(home + ' ' + injuries.homeOut + '人缺阵，进攻力-' + ((1 - hInj) * 100).toFixed(0) + '%');
  }
  if (injuries.awayOut > 0) {
    var aInj = Math.max(0.7, 1 - injuries.awayOut * 0.04);
    aLambda *= aInj;
    factors.push(away + ' ' + injuries.awayOut + '人缺阵，进攻力-' + ((1 - aInj) * 100).toFixed(0) + '%');
  }

  var matrix = poissonMatrix(hLambda, aLambda, 8);
  var total = matrix.hWin + matrix.draw + matrix.aWin;
  var hProb = matrix.hWin / total, dProb = matrix.draw / total, aProb = matrix.aWin / total;

  return {
    hProb: hProb, dProb: dProb, aProb: aProb,
    hLambda: hLambda, aLambda: aLambda,
    bestScore: matrix.bestScore,
    home: home, away: away,
    analysis: '综合积分榜数据、近期战绩（加权）、H2H历史对阵及伤停信息，泊松矩阵精算。',
    keyFactor: '近状修正后期望比分 ' + matrix.bestScore[0] + ':' + matrix.bestScore[1],
    factors: factors
  };
}

// =====================================================
// 模型三：天机神算（神级 · 全因子 + 天气 + 蒙特卡洛）
// =====================================================
async function modelTianJi(m, summary, standings, weather) {
  var home = cnName((m.homeTeam && m.homeTeam.name) || '主队');
  var away = cnName((m.awayTeam && m.awayTeam.name) || '客队');
  var factors = [];

  // 基础积分榜
  var homeStd = standings ? findTeamInStandings(standings, m.homeTeam && m.homeTeam.name) : null;
  var awayStd = standings ? findTeamInStandings(standings, m.awayTeam && m.awayTeam.name) : null;
  var hGoalFor = 1.5, hGoalAgainst = 1.2, aGoalFor = 1.2, aGoalAgainst = 1.5;
  if (homeStd) {
    var hP = homeStd['gamesPlayed'] || homeStd['GP'] || 1;
    hGoalFor = (homeStd['pointsFor'] || homeStd['GF'] || homeStd['goalsFor'] || hGoalFor * hP) / hP;
    hGoalAgainst = (homeStd['pointsAgainst'] || homeStd['GA'] || homeStd['goalsAgainst'] || hGoalAgainst * hP) / hP;
  }
  if (awayStd) {
    var aP = awayStd['gamesPlayed'] || awayStd['GP'] || 1;
    aGoalFor = (awayStd['pointsFor'] || awayStd['GF'] || awayStd['goalsFor'] || aGoalFor * aP) / aP;
    aGoalAgainst = (awayStd['pointsAgainst'] || awayStd['GA'] || awayStd['goalsAgainst'] || aGoalAgainst * aP) / aP;
  }
  var leagueAvg = 1.35;
  var hLambda = Math.max(0.3, (hGoalFor * aGoalAgainst) / leagueAvg) * 1.12;
  var aLambda = Math.max(0.3, (aGoalFor * hGoalAgainst) / leagueAvg);

  // 近期战绩修正
  var form = extractRecentForm(summary);
  var hForm = form.home.length > 0 ? formScore(form.home) : 0.5;
  var aForm = form.away.length > 0 ? formScore(form.away) : 0.5;
  hLambda *= (0.75 + hForm * 0.5);
  aLambda *= (0.75 + aForm * 0.5);
  if (form.home.length > 0) factors.push(home + ' 近' + form.home.length + '场：' + form.home.join(''));
  if (form.away.length > 0) factors.push(away + ' 近' + form.away.length + '场：' + form.away.join(''));

  // H2H
  var h2h = extractH2H(summary);
  if (h2h.total > 0) {
    hLambda *= (0.85 + (h2h.homeWins / h2h.total) * 0.3);
    aLambda *= (0.85 + (h2h.awayWins / h2h.total) * 0.3);
    factors.push('H2H ' + h2h.total + '场记录：主' + h2h.homeWins + '/ 平' + h2h.draws + '/ 客' + h2h.awayWins);
  }

  // 伤停
  var injuries = extractInjuries(summary);
  if (injuries.homeOut > 0) { hLambda *= Math.max(0.7, 1 - injuries.homeOut * 0.04); factors.push(home + ' 缺阵' + injuries.homeOut + '人'); }
  if (injuries.awayOut > 0) { aLambda *= Math.max(0.7, 1 - injuries.awayOut * 0.04); factors.push(away + ' 缺阵' + injuries.awayOut + '人'); }

  // 天气修正
  if (weather) {
    var weatherMod = 1.0;
    var weatherDesc = [];
    if (weather.rain > 5) { weatherMod -= 0.08; weatherDesc.push('大雨(' + weather.rain.toFixed(1) + 'mm) 进球率-8%'); }
    else if (weather.rain > 1) { weatherMod -= 0.03; weatherDesc.push('小雨(' + weather.rain.toFixed(1) + 'mm) 进球率-3%'); }
    if (weather.wind > 50) { weatherMod -= 0.06; weatherDesc.push('强风(' + weather.wind.toFixed(0) + 'km/h) -6%'); }
    else if (weather.wind > 30) { weatherMod -= 0.03; weatherDesc.push('有风(' + weather.wind.toFixed(0) + 'km/h) -3%'); }
    if (weather.tempMax > 35) { weatherMod -= 0.05; weatherDesc.push('高温(' + weather.tempMax + '°C) 体能损耗-5%'); }
    else if (weather.tempMin < 0) { weatherMod -= 0.04; weatherDesc.push('严寒(' + weather.tempMin + '°C) -4%'); }
    hLambda *= Math.max(0.5, weatherMod);
    aLambda *= Math.max(0.5, weatherMod);
    if (weatherDesc.length > 0) factors.push('天气：' + weatherDesc.join('，'));
    else factors.push('天气：适宜(' + weather.tempMin + '~' + weather.tempMax + '°C，风速' + weather.wind.toFixed(0) + 'km/h)');
  }

  // 比赛重要性修正（决赛/末轮 → 低进球，小组赛末轮 → 可能大胜）
  var matchName = (m.leagueName || '').toLowerCase();
  if (matchName.indexOf('champions') >= 0 || matchName.indexOf('欧冠') >= 0) {
    hLambda *= 0.95; aLambda *= 0.95;
    factors.push('欧冠淘汰赛 · 双方保守，进球率-5%');
  }

  // 蒙特卡洛模拟 10000 次（固定种子，同场比赛结果稳定）
  hLambda = Math.max(0.2, hLambda);
  aLambda = Math.max(0.2, aLambda);
  var mc = monteCarlo(hLambda, aLambda, 10000, matchSeed(m.id || m.matchId || ''));

  // 置信度（两支球队强弱差距 → 置信度高低）
  var strongerProb = Math.max(mc.hWin, mc.aWin);
  var confidence = strongerProb > 0.65 ? '高' : strongerProb > 0.50 ? '中' : '低';
  factors.push('蒙特卡洛置信度：' + confidence + ' (' + (strongerProb * 100).toFixed(0) + '%)');

  return {
    hProb: mc.hWin, dProb: mc.draw, aProb: mc.aWin,
    hLambda: hLambda, aLambda: aLambda,
    bestScore: mc.bestScore,
    home: home, away: away,
    analysis: '全因子融合：积分榜 · 近期战绩 · H2H对阵 · 伤停 · 天气。蒙特卡洛10000次模拟，置信度：' + confidence + '。',
    keyFactor: '模拟最可能比分 ' + mc.bestScore[0] + ':' + mc.bestScore[1] + ' · 置信度' + confidence,
    factors: factors
  };
}

// =====================================================
// 预测主入口
// =====================================================
function showPredLoading(msg) {
  document.getElementById('predLoading').style.display = 'block';
  document.getElementById('predLoading').textContent = msg;
  document.getElementById('predMainResult').style.display = 'none';
}
function hidePredLoading() {
  document.getElementById('predLoading').style.display = 'none';
  document.getElementById('predMainResult').style.display = 'block';
}

function renderPredResult(r, modelLabel) {
  document.getElementById('resModelName').textContent = modelLabel;
  var topProb = Math.max(r.hProb, r.dProb, r.aProb);
  var winner = r.hProb >= r.aProb
    ? (r.hProb > r.dProb + 0.04 ? r.home + ' 获胜' : '双方平局')
    : (r.aProb > r.dProb + 0.04 ? r.away + ' 获胜' : '双方平局');
  document.getElementById('resWinner').textContent = '▶ ' + winner + '（' + (topProb * 100).toFixed(1) + '%）';
  document.getElementById('resScorePred').textContent = r.bestScore[0] + ' : ' + r.bestScore[1];
  document.getElementById('resProbs').innerHTML = buildProbBars(r.home, r.away, r.hProb, r.dProb, r.aProb);
  document.getElementById('resAnalysis').textContent = r.analysis;
  document.getElementById('resKeyFactor').textContent = '🔑 ' + r.keyFactor;
  var facEl = document.getElementById('resFactors');
  facEl.innerHTML = '';
  (r.factors || []).forEach(function(f) {
    var chip = document.createElement('span');
    chip.className = 'factor-chip';
    chip.textContent = f;
    facEl.appendChild(chip);
  });
  document.getElementById('predResult').classList.add('show');
}

async function runPrediction() {
  if (!currentMatch) return;
  var btn = document.getElementById('summonBtn');
  btn.disabled = true; btn.textContent = '神谕推演中...';
  document.getElementById('predResult').classList.add('show');
  document.getElementById('predMainResult').style.display = 'none';

  var modelLabels = {
    luopan: '🧭 星象罗盘 · 积分榜泊松精算',
    zhanshen: '⚔️ 战神推演 · 近战+H2H+伤停',
    tianji: '🌌 天机神算 · 全因子蒙特卡洛'
  };

  showPredLoading('正在获取真实赛事数据...');

  try {
    // 并行获取：summary + standings + 天气
    var matchId = currentMatch.id;
    var leagueCode = currentMatch.leagueCode;
    var kickoff = new Date(currentMatch.utcDate || Date.now());
    var dateStr = fmt(kickoff);
    var coords = getCityCoords((currentMatch.homeTeam && currentMatch.homeTeam.name) || '');

    var tasks = [
      fetchMatchSummary(matchId),
      fetchStandings(leagueCode)
    ];
    // 天机神算额外获取天气
    if (selectedModel === 'tianji') {
      tasks.push(fetchWeather(coords[0], coords[1], dateStr));
    }

    showPredLoading(selectedModel === 'tianji' ? '正在分析战绩、对阵历史及比赛当地天气...' : '正在解析真实战绩数据...');
    var results = await Promise.all(tasks);
    var summary = results[0] || {};
    var standings = results[1] || null;
    var weather = results[2] || null;

    var r;
    if (selectedModel === 'luopan') {
      showPredLoading('泊松矩阵精算中...');
      r = await modelLuoPan(currentMatch, summary, standings);
    } else if (selectedModel === 'zhanshen') {
      showPredLoading('战神推演中，整合近战战绩与对阵历史...');
      r = await modelZhanShen(currentMatch, summary, standings);
    } else {
      showPredLoading('天机神算：蒙特卡洛10000次模拟中...');
      r = await modelTianJi(currentMatch, summary, standings, weather);
    }

    hidePredLoading();
    renderPredResult(r, modelLabels[selectedModel] || selectedModel);
  } catch(e) {
    hidePredLoading();
    document.getElementById('resModelName').textContent = '预测出错';
    document.getElementById('resWinner').textContent = e.message || '数据获取失败，请重试';
    document.getElementById('resScorePred').textContent = '';
    document.getElementById('resProbs').innerHTML = '';
    document.getElementById('resAnalysis').textContent = '';
    document.getElementById('resKeyFactor').textContent = '';
    document.getElementById('resFactors').innerHTML = '';
    document.getElementById('predMainResult').style.display = 'block';
    document.getElementById('predResult').classList.add('show');
  }

  btn.disabled = false; btn.textContent = '重新预测 🔮';
}
