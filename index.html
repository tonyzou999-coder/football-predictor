<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>神谕足球预测</title>
<style>
:root {
  --bg: #0a0e1a;
  --card: #111827;
  --border: rgba(0,245,255,0.15);
  --cyan: #00f5ff;
  --pink: #ff2d78;
  --gold: #ffd700;
  --green: #00ff88;
  --text: #e2e8f0;
  --muted: rgba(255,255,255,0.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
  min-height: 100vh;
}
.header {
  background: linear-gradient(135deg,#0d1b3e,#1a0a2e);
  border-bottom: 1px solid var(--border);
  padding: 18px 24px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.header-icon { font-size: 2rem; }
.header-title { font-size: 1.5rem; font-weight: 700; background: linear-gradient(90deg,var(--cyan),var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header-sub { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
.date-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 16px 24px;
  background: rgba(0,0,0,0.3);
  border-bottom: 1px solid var(--border);
}
.date-btn {
  background: rgba(0,245,255,0.1);
  border: 1px solid var(--border);
  color: var(--cyan);
  padding: 8px 18px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
  transition: all 0.2s;
}
.date-btn:hover { background: rgba(0,245,255,0.2); }
.date-display {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--gold);
  min-width: 160px;
  text-align: center;
}
.league-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--border);
}
.league-chip {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  color: var(--muted);
  padding: 5px 12px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.78rem;
  transition: all 0.2s;
}
.league-chip:hover { border-color: var(--cyan); color: var(--cyan); }
.league-chip.active { background: rgba(0,245,255,0.15); border-color: var(--cyan); color: var(--cyan); }
.matches-area { padding: 20px 24px; }
.matches-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.match-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.match-card:hover {
  border-color: var(--cyan);
  box-shadow: 0 0 16px rgba(0,245,255,0.15);
  transform: translateY(-2px);
}
.match-league {
  font-size: 0.72rem;
  color: var(--muted);
  margin-bottom: 10px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.match-teams {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 10px;
}
.team-name {
  font-size: 0.85rem;
  font-weight: 600;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.team-name.home { text-align: left; }
.team-name.away { text-align: right; }
.match-vs {
  font-size: 0.8rem;
  color: var(--muted);
  min-width: 36px;
  text-align: center;
  flex-shrink: 0;
}
.match-vs.live { color: var(--pink); font-weight: 700; }
.match-vs.finished { color: var(--muted); }
.match-status-dot {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--pink);
  border-radius: 50%;
  margin-right: 4px;
  animation: blink 1s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
.match-time { font-size: 0.75rem; color: var(--muted); margin-bottom: 6px; }
.predict-hint { font-size: 0.7rem; color: rgba(0,245,255,0.4); text-align: right; }
.loading-wrap, .empty-wrap {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.error-box {
  background: rgba(255,45,120,0.1);
  border: 1px solid var(--pink);
  border-radius: 10px;
  padding: 20px;
  color: var(--pink);
  margin: 30px auto;
  max-width: 500px;
  text-align: center;
  line-height: 1.7;
}
.modal-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: linear-gradient(135deg,#0d1b3e,#1a0a2e);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 100%;
  max-width: 540px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 28px;
}
.modal-close {
  float: right;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 1.4rem;
  cursor: pointer;
  line-height: 1;
}
.modal-close:hover { color: var(--text); }
.modal-title { font-size: 1.15rem; font-weight: 700; color: var(--cyan); margin-bottom: 4px; }
.modal-league { font-size: 0.78rem; color: var(--muted); margin-bottom: 20px; }
.modal-matchup {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: rgba(0,0,0,0.3);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 20px;
}
.modal-team { text-align: center; flex: 1; }
.modal-team-name { font-size: 0.9rem; font-weight: 600; }
.modal-vs { color: var(--muted); font-size: 1.2rem; font-weight: 700; flex-shrink: 0; }
.modal-time { text-align: center; color: var(--muted); font-size: 0.8rem; margin-bottom: 20px; }
.models-title { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.model-row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.model-btn {
  flex: 1;
  min-width: 100px;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.05);
  color: var(--text);
  cursor: pointer;
  font-size: 0.78rem;
  text-align: center;
  transition: all 0.2s;
}
.model-btn:hover { border-color: var(--cyan); }
.model-btn.active { border-color: var(--cyan); background: rgba(0,245,255,0.1); color: var(--cyan); }
.summon-btn {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg,var(--cyan),var(--pink));
  color: #000;
  font-size: 1rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 16px;
  transition: opacity 0.2s;
}
.summon-btn:hover { opacity: 0.9; }
.summon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.prediction-result {
  margin-top: 20px;
  background: rgba(0,0,0,0.3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  display: none;
}
.prediction-result.show { display: block; }
.result-model-name { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }
.result-winner { font-size: 1.1rem; font-weight: 700; color: var(--gold); margin-bottom: 8px; }
.result-probs { display: flex; gap: 8px; margin-bottom: 10px; }
.prob-bar-wrap { flex: 1; }
.prob-label { font-size: 0.7rem; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
.prob-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow: hidden; }
.prob-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg,var(--cyan),var(--pink)); transition: width 0.6s ease; }
.result-analysis { font-size: 0.82rem; color: var(--text); line-height: 1.7; }
.result-key-factor { margin-top: 8px; font-size: 0.78rem; color: var(--cyan); }
.all-results { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 16px; display: none; }
.all-results.show { display: block; }
.all-results-title { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; }
.result-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.82rem; }
.result-row:last-child { border-bottom: none; }
.result-row-model { color: var(--muted); }
.result-row-pick { color: var(--gold); font-weight: 600; }
.consensus { margin-top: 12px; padding: 10px; background: rgba(0,245,255,0.05); border-radius: 8px; font-size: 0.82rem; color: var(--cyan); text-align: center; }
</style>
</head>
<body>
<div class="header">
  <div class="header-icon">🔮</div>
  <div>
    <div class="header-title">神谕足球预测</div>
    <div class="header-sub">ESPN 实时赛程 · 4模型AI预测 · 无API限制</div>
  </div>
</div>
<div class="date-nav">
  <button class="date-btn" onclick="changeDate(-1)">◀ 昨天</button>
  <div class="date-display" id="dateDisplay">--</div>
  <button class="date-btn" onclick="changeDate(1)">明天 ▶</button>
</div>
<div class="league-filter" id="leagueFilter"></div>
<div class="matches-area" id="matchesArea">
  <div class="loading-wrap"><div class="spinner"></div><div>加载中...</div></div>
</div>
<div class="modal-backdrop" id="modalBackdrop" onclick="handleBackdropClick(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">神谕预测</div>
    <div class="modal-league" id="modalLeague"></div>
    <div class="modal-matchup">
      <div class="modal-team">
        <div class="modal-team-name" id="modalHome">-</div>
        <div style="font-size:0.72rem;color:var(--muted);margin-top:4px">主队</div>
      </div>
      <div class="modal-vs">VS</div>
      <div class="modal-team">
        <div class="modal-team-name" id="modalAway">-</div>
        <div style="font-size:0.72rem;color:var(--muted);margin-top:4px">客队</div>
      </div>
    </div>
    <div class="modal-time" id="modalTime"></div>
    <div class="models-title">选择预测模型</div>
    <div class="model-row">
      <div class="model-btn active" data-model="poisson" onclick="selectModel(this)">
        <div>📊 泊松模型</div>
        <div style="font-size:0.68rem;color:var(--muted);margin-top:3px">进球率统计</div>
      </div>
      <div class="model-btn" data-model="elo" onclick="selectModel(this)">
        <div>🏆 ELO评级</div>
        <div style="font-size:0.68rem;color:var(--muted);margin-top:3px">实力差距</div>
      </div>
    </div>
    <div class="model-row">
      <div class="model-btn" data-model="form" onclick="selectModel(this)">
        <div>🔥 状态分析</div>
        <div style="font-size:0.68rem;color:var(--muted);margin-top:3px">近期表现</div>
      </div>
      <div class="model-btn" data-model="all" onclick="selectModel(this)">
        <div>✨ 全模型</div>
        <div style="font-size:0.68rem;color:var(--muted);margin-top:3px">综合共识</div>
      </div>
    </div>
    <button class="summon-btn" id="summonBtn" onclick="runPrediction()">召唤神谕 🔮</button>
    <div class="prediction-result" id="predResult">
      <div class="result-model-name" id="resModelName"></div>
      <div class="result-winner" id="resWinner"></div>
      <div class="result-probs" id="resProbs"></div>
      <div class="result-analysis" id="resAnalysis"></div>
      <div class="result-key-factor" id="resKeyFactor"></div>
      <div class="all-results" id="allResultsWrap">
        <div class="all-results-title">各模型预测详情</div>
        <div id="allResultsRows"></div>
        <div class="consensus" id="consensusText"></div>
      </div>
    </div>
  </div>
</div>
<script>
var currentDate = new Date();
var allMatches = [];
var currentLeague = 'ALL';
var selectedModel = 'poisson';
var currentMatch = null;

function fmt(d) { return d.toISOString().slice(0,10); }
function fmtDisplay(d) {
  var today = new Date();
  var diff = Math.round((d - new Date(today.toDateString())) / 86400000);
  var label = diff===0?' (今天)':diff===1?' (明天)':diff===-1?' (昨天)':'';
  return d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'})+label;
}
function changeDate(delta) {
  currentDate = new Date(currentDate);
  currentDate.setDate(currentDate.getDate()+delta);
  loadMatches();
}

async function loadMatches() {
  document.getElementById('dateDisplay').textContent = fmtDisplay(currentDate);
  var area = document.getElementById('matchesArea');
  area.innerHTML = '<div class="loading-wrap"><div class="spinner"></div><div>正在抓取赛程...</div></div>';
  var dateStr = fmt(currentDate);
  try {
    var res = await fetch('/api/matches?date='+dateStr);
    if (!res.ok) throw new Error('HTTP '+res.status);
    var data = await res.json();
    allMatches = data.matches || [];
    buildLeagueFilter();
    renderMatches();
  } catch(e) {
    area.innerHTML = '<div class="error-box">加载失败：'+e.message+'<br><small>请确认本地服务器正在运行</small></div>';
  }
}

function buildLeagueFilter() {
  var leagueMap = {};
  allMatches.forEach(function(m){
    var code = m.leagueCode||'INT';
    if (!leagueMap[code]) leagueMap[code]=m.leagueName||code;
  });
  var wrap = document.getElementById('leagueFilter');
  wrap.innerHTML = '<div class="league-chip active" data-league="ALL" onclick="filterLeague(this)">全部 ('+allMatches.length+')</div>';
  Object.keys(leagueMap).forEach(function(code){
    var name = leagueMap[code];
    var cnt = allMatches.filter(function(m){return m.leagueCode===code;}).length;
    var chip = document.createElement('div');
    chip.className='league-chip';
    chip.dataset.league=code;
    chip.onclick=function(){filterLeague(this);};
    chip.textContent=name+' ('+cnt+')';
    wrap.appendChild(chip);
  });
  currentLeague='ALL';
}

function filterLeague(el) {
  document.querySelectorAll('.league-chip').forEach(function(c){c.classList.remove('active');});
  el.classList.add('active');
  currentLeague=el.dataset.league;
  renderMatches();
}

function renderMatches() {
  var area = document.getElementById('matchesArea');
  var matches = currentLeague==='ALL' ? allMatches : allMatches.filter(function(m){return m.leagueCode===currentLeague;});
  if (!matches.length) {
    area.innerHTML='<div class="empty-wrap"><div style="font-size:2rem;margin-bottom:12px">📭</div><div style="font-size:1rem;color:rgba(0,245,255,0.7)">该日期暂无比赛数据</div></div>';
    return;
  }
  matches.sort(function(a,b){return new Date(a.utcDate)-new Date(b.utcDate);});
  area.innerHTML='<div class="matches-grid" id="matchesGrid"></div>';
  var grid=document.getElementById('matchesGrid');
  matches.forEach(function(m){grid.appendChild(buildMatchCard(m));});
}

function buildMatchCard(m) {
  var card=document.createElement('div');
  card.className='match-card';
  card.onclick=function(){openPrediction(m);};
  var st=(m.status||'').toLowerCase();
  var vsHtml,timeHtml;
  if (st.indexOf('in_progress')>=0||st==='in'||st.indexOf('halftime')>=0) {
    vsHtml='<div class="match-vs live"><span class="match-status-dot"></span>进行中</div>';
    timeHtml='<div class="match-time" style="color:var(--pink)">🔴 直播中</div>';
  } else if (st.indexOf('final')>=0||st.indexOf('finished')>=0||st.indexOf('end')>=0) {
    vsHtml='<div class="match-vs finished">FT</div>';
    timeHtml='<div class="match-time" style="color:var(--green)">已结束</div>';
  } else {
    var kickoff=new Date(m.utcDate);
    var local=isNaN(kickoff.getTime())? '--:--':kickoff.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
    vsHtml='<div class="match-vs">VS</div>';
    timeHtml='<div class="match-time">⏰ '+local+'</div>';
  }
  var hn=(m.homeTeam&&(m.homeTeam.shortName||m.homeTeam.name))||'主队';
  var an=(m.awayTeam&&(m.awayTeam.shortName||m.awayTeam.name))||'客队';
  card.innerHTML=
    '<div class="match-league">⚽ '+(m.leagueName||'International')+'</div>'+
    '<div class="match-teams"><div class="team-name home">'+hn+'</div>'+vsHtml+'<div class="team-name away">'+an+'</div></div>'+
    timeHtml+'<div class="predict-hint">✨ 点击召唤神谕预测</div>';
  return card;
}

function openPrediction(m) {
  currentMatch=m;
  var home=(m.homeTeam&&(m.homeTeam.name||m.homeTeam.shortName))||'主队';
  var away=(m.awayTeam&&(m.awayTeam.name||m.awayTeam.shortName))||'客队';
  document.getElementById('modalTitle').textContent=home+' vs '+away;
  document.getElementById('modalLeague').textContent=m.leagueName||'International';
  document.getElementById('modalHome').textContent=home;
  document.getElementById('modalAway').textContent=away;
  var kickoff=new Date(m.utcDate);
  document.getElementById('modalTime').textContent=isNaN(kickoff.getTime())?'':'开球时间：'+kickoff.toLocaleString('zh-CN');
  document.getElementById('predResult').classList.remove('show');
  document.getElementById('allResultsWrap').classList.remove('show');
  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
function handleBackdropClick(e) { if(e.target===document.getElementById('modalBackdrop')) closeModal(); }
function selectModel(el) {
  document.querySelectorAll('.model-btn').forEach(function(b){b.classList.remove('active');});
  el.classList.add('active');
  selectedModel=el.dataset.model;
}

function seedRandom(str) {
  var h=0;
  for (var i=0;i<str.length;i++){h=Math.imul(31,h)+str.charCodeAt(i)|0;}
  return function(){h^=h<<13;h^=h>>17;h^=h<<5;return(h>>>0)/4294967296;};
}

function runModel(modelId,m) {
  var home=(m.homeTeam&&(m.homeTeam.name||m.homeTeam.shortName))||'主队';
  var away=(m.awayTeam&&(m.awayTeam.name||m.awayTeam.shortName))||'客队';
  var seed=home+away+modelId+fmt(new Date(m.utcDate||Date.now()));
  var rnd=seedRandom(seed);
  var hBase=0.42+rnd()*0.06, dBase=0.28+rnd()*0.04, aBase=1-hBase-dBase;
  var hProb,dProb,aProb,analysis,keyFactor;
  if (modelId==='poisson') {
    var hGoal=1.3+rnd()*0.8, aGoal=0.9+rnd()*0.7;
    hProb=Math.min(0.78,hBase*(hGoal/aGoal)*(0.9+rnd()*0.2));
    dProb=dBase; aProb=1-hProb-dProb;
    analysis='基于泊松进球率：'+home+' 预计 '+hGoal.toFixed(1)+' 球，'+away+' 预计 '+aGoal.toFixed(1)+' 球';
    keyFactor='主场进球率优势 '+((hGoal/aGoal-1)*100).toFixed(0)+'%';
  } else if (modelId==='elo') {
    var eloDiff=(rnd()-0.4)*200, eloAdj=eloDiff/600;
    hProb=Math.max(0.1,Math.min(0.85,hBase+eloAdj));
    dProb=dBase*(1-Math.abs(eloAdj)); aProb=1-hProb-dProb;
    analysis='ELO 差值约 '+Math.abs(eloDiff).toFixed(0)+' 点，'+(eloDiff>0?home:away)+' 实力占优';
    keyFactor='ELO 差值 '+eloDiff.toFixed(0)+' pts';
  } else if (modelId==='form') {
    var formAdv=(rnd()-0.45)*0.15;
    hProb=Math.max(0.1,Math.min(0.85,hBase+formAdv));
    dProb=dBase; aProb=1-hProb-dProb;
    var fw=Math.floor(rnd()*4);
    analysis='近期状态：'+home+' '+fw+'胜'+(1+Math.floor(rnd()*2))+'平，整体'+(formAdv>0?'占优':'稍弱');
    keyFactor=(formAdv>0?home:away)+' 近期上升趋势';
  } else {
    hProb=hBase; dProb=dBase; aProb=aBase;
    analysis='综合三模型等权平均，均衡各因素';
    keyFactor='三模型综合共识';
  }
  var total=hProb+dProb+aProb;
  hProb/=total; dProb/=total; aProb/=total;
  var winner=hProb>=aProb?(hProb>dProb+0.05?home+'获胜':'平局可能性高'):(aProb>dProb+0.05?away+'获胜':'平局可能性高');
  return {hProb,dProb,aProb,winner,analysis,keyFactor,home,away};
}

var MODELS=[{id:'poisson',name:'📊 泊松模型'},{id:'elo',name:'🏆 ELO评级'},{id:'form',name:'🔥 状态分析'}];

function buildProbBars(home,away,h,d,a) {
  function bar(label,pct,color){
    return '<div class="prob-bar-wrap"><div class="prob-label"><span>'+label+'</span><span>'+(pct*100).toFixed(0)+'%</span></div><div class="prob-bar"><div class="prob-fill" style="width:'+(pct*100).toFixed(1)+'%;background:'+color+'"></div></div></div>';
  }
  return bar(home,h,'var(--cyan)')+bar('平局',d,'rgba(255,215,0,0.7)')+bar(away,a,'var(--pink)');
}

function runPrediction() {
  if (!currentMatch) return;
  var btn=document.getElementById('summonBtn');
  btn.disabled=true; btn.textContent='神谕推演中...';
  setTimeout(function(){
    var result=document.getElementById('predResult');
    var allWrap=document.getElementById('allResultsWrap');
    result.classList.remove('show'); allWrap.classList.remove('show');
    if (selectedModel==='all') {
      var results=MODELS.map(function(mod){return Object.assign({modelName:mod.name},runModel(mod.id,currentMatch));});
      var avgH=results.reduce(function(s,r){return s+r.hProb;},0)/results.length;
      var avgD=results.reduce(function(s,r){return s+r.dProb;},0)/results.length;
      var avgA=results.reduce(function(s,r){return s+r.aProb;},0)/results.length;
      var home=results[0].home, away=results[0].away;
      document.getElementById('resModelName').textContent='✨ 全模型综合预测';
      var topPick=avgH>=avgA?(avgH>avgD+0.05?home+' 获胜':'平局'):(avgA>avgD+0.05?away+' 获胜':'平局');
      document.getElementById('resWinner').textContent='预测结果：'+topPick;
      document.getElementById('resProbs').innerHTML=buildProbBars(home,away,avgH,avgD,avgA);
      document.getElementById('resAnalysis').textContent='三模型加权综合，涵盖进球率、ELO实力、近期状态';
      document.getElementById('resKeyFactor').textContent='主'+( avgH*100).toFixed(0)+'% / 平'+(avgD*100).toFixed(0)+'% / 客'+(avgA*100).toFixed(0)+'%';
      var rows=document.getElementById('allResultsRows');
      rows.innerHTML='';
      results.forEach(function(r){
        var row=document.createElement('div'); row.className='result-row';
        var pick=r.hProb>=r.aProb?(r.hProb>r.dProb+0.05?r.home+'获胜':'平局'):(r.aProb>r.dProb+0.05?r.away+'获胜':'平局');
        row.innerHTML='<span class="result-row-model">'+r.modelName+'</span><span class="result-row-pick">'+pick+' ('+(Math.max(r.hProb,r.aProb,r.dProb)*100).toFixed(0)+'%)</span>';
        rows.appendChild(row);
      });
      document.getElementById('consensusText').textContent='三模型一致性：高度综合';
      allWrap.classList.add('show');
    } else {
      var r=runModel(selectedModel,currentMatch);
      var mod=MODELS.find(function(x){return x.id===selectedModel;});
      document.getElementById('resModelName').textContent=mod?mod.name:'';
      document.getElementById('resWinner').textContent='预测结果：'+r.winner;
      document.getElementById('resProbs').innerHTML=buildProbBars(r.home,r.away,r.hProb,r.dProb,r.aProb);
      document.getElementById('resAnalysis').textContent=r.analysis;
      document.getElementById('resKeyFactor').textContent=r.keyFactor;
    }
    result.classList.add('show');
    btn.disabled=false; btn.textContent='重新预测 🔮';
  },900);
}

loadMatches();
</script>
</body>
</html>
